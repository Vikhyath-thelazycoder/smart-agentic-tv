name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board, Android version and app versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "From adb logcat -s SmartAgenticTV. Remove anything private. Never paste API keys."
      render: text
