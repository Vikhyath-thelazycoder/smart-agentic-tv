# U.11 universal board: HiSilicon Hi3751V350, KitKing firmware, Android 9. Tested on one TV. See docs/SUPPORTED-BOARDS.md.
match=com.kitking.pisceslauncher
# The firmware reopens its own launcher at every start, so it is sent back to this home screen.
old_home=com.kitking.pisceslauncher
# Names from /proc/bus/input/devices.
mouse_device=Hi mouse
keyboard_device=Hi keyboard
# This board's Source button has no Android key: the scan code goes to the keyboard device.
source_scan_code=250
settings_activity=com.kitking.mbasesetting/com.kitking.mbasesetting.activity.MainActivity
miracast_activity=com.hisilicon.miracast/com.hisilicon.miracast.activity.WelcomeActivity
# Never opened from a phone: factory and firmware tools can damage this board, and the old launcher fights this one.
never_open=com.kitking.autofactorytest,com.kitking.upgrade,com.hikeymasterprovision,com.kitking.pisceslauncher,com.kitking.tvremote
